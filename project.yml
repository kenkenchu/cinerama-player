name: Cinerama
options:
  bundleIdPrefix: com.cinerama-player
  deploymentTarget:
    macOS: "26.0"
    tvOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  fileTypes:
    icon: folder.iconcomposer.icon

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Cinerama-macOS:
    type: application
    productName: Cinerama
    platform: macOS
    sources:
      - path: Cinerama/Sources
      - path: Cinerama/Resources
        buildPhase: resources
    settings:
      base:
        ARCHS: arm64
        # Keep the app's real code in its executable. A shared debug launcher
        # UUID can confuse macOS local-network privacy attribution.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.cinerama-player.mac
        PRODUCT_NAME: Cinerama
        PRODUCT_MODULE_NAME: Cinerama
        INFOPLIST_FILE: Cinerama/Support/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Cinerama/Support/Cinerama-macOS.entitlements
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: CineramaIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - framework: Frameworks/VLCKit.xcframework
        embed: true
      - framework: Frameworks/CineramaDovi.xcframework
        embed: false
    postBuildScripts:
      - script: ./scripts/verify_embedded_vlckit.sh
        name: Verify embedded desktop VLCKit
        basedOnDependencyAnalysis: false

  Cinerama-tvOS:
    type: application
    productName: Cinerama
    platform: tvOS
    sources:
      # TV UI lives outside the recursive Mac source tree.
      - path: CineramaTV/Sources
      - path: CineramaTV/Resources
        buildPhase: resources
      - path: Cinerama/Sources/Models
      - path: Cinerama/Sources/PlexService
      - path: Cinerama/Sources/Shared/AppImageCache.swift
      - path: Cinerama/Sources/Shared/String+NilIfEmpty.swift
      - path: Cinerama/Sources/Features/Home/HomeViewModel.swift
      - path: Cinerama/Sources/Features/Home/HomeHubItemsViewModel.swift
      - path: Cinerama/Sources/Features/Home/HomeRecommendationEngine.swift
      - path: Cinerama/Sources/Features/Home/HomePersonalizedShelf.swift
      - path: Cinerama/Sources/Features/Home/HomeHubFilter.swift
      - path: Cinerama/Sources/Features/Home/HomeHubArrangement.swift
      - path: Cinerama/Sources/Features/Home/HomeFirstPaintGate.swift
      - path: Cinerama/Sources/Features/Libraries/LibraryGenreSupport.swift
      - path: Cinerama/Sources/Features/Libraries/LibraryItemsViewModel.swift
      - path: Cinerama/Sources/Features/Libraries/LibraryUnwatchedFilter.swift
      - path: Cinerama/Sources/Shared/RecommendationCore.swift
      - path: Cinerama/Sources/Shared/MediaFormatting.swift
      - path: Cinerama/Sources/Shared/PlexItemPresentation.swift
      - path: Cinerama/Sources/Shared/PlexService+WatchedFanOut.swift
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: com.cinerama-player.tv
        PRODUCT_NAME: Cinerama
        PRODUCT_MODULE_NAME: CineramaTV
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: TVIcon
        INFOPLIST_FILE: CineramaTV/Support/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(CINERAMA_TVOS_TEAM)"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_DEBUG_DYLIB: NO
        TARGETED_DEVICE_FAMILY: "3"

  CineramaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CineramaTests
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: com.cinerama-player.mac.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cinerama.app/Contents/MacOS/Cinerama"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Cinerama-macOS

  CineramaTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: CineramaTVTests
      - path: CineramaTests/HomeHubArrangementTests.swift
      - path: CineramaTests/LibraryUnwatchedFilterTests.swift
      - path: CineramaTests/PlexMediaPartDecodingTests.swift
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: com.cinerama-player.tv.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(CINERAMA_TVOS_TEAM)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cinerama.app/Cinerama"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "3"
    dependencies:
      - target: Cinerama-tvOS

schemes:
  Cinerama-macOS:
    build:
      targets:
        Cinerama-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CineramaTests
    archive:
      config: Release

  Cinerama-tvOS:
    build:
      targets:
        Cinerama-tvOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CineramaTVTests
    archive:
      config: Release
