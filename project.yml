name: Dusk
options:
  bundleIdPrefix: com.dusk-player
  deploymentTarget:
    iOS: "18.0"
    tvOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  fileTypes:
    icon: folder.iconcomposer.icon

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Dusk:
    type: application
    platform: iOS
    sources:
      - path: Dusk/Sources
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          - LaunchScreen-tvOS.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app
        CODE_SIGN_ENTITLEMENTS: Dusk/Support/Dusk.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-iOS.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: DuskIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: DuskIconDawn DuskIconMidnight DuskIconNeon DuskIconMono DuskIconAurora DuskIconGoldenHour DuskIconVelvet DuskIconEmerald DuskIconGilded
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Dusk/Sources/Playback $(PROJECT_DIR)/Frameworks/MobileVLCKit.xcframework/ios-arm64/MobileVLCKit.framework/Headers $(PROJECT_DIR)/Frameworks/MobileVLCKit.xcframework/ios-arm64-simulator/MobileVLCKit.framework/Headers"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Dusk/Support/Dusk-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
      # Static Rust archive (Dolby Vision 7 -> 8.1), built by
      # ci_scripts/install_dusk_dovi.sh. Linked into the app binary, never embedded.
      - framework: Frameworks/DuskDovi.xcframework
        embed: false
    postBuildScripts:
      - script: ./scripts/verify_embedded_vlckit.sh
        name: Verify embedded VLCKit is not stale
        basedOnDependencyAnalysis: false

  Dusk-macOS:
    type: application
    platform: macOS
    sources:
      - path: Dusk/Sources
        excludes:
          - App/MainTabView.swift
          - App/MainTabShells.swift
          - App/MoreView.swift
          - App/ScreenshotMode.swift
          - Playback/VLCKitEngine.swift
          - Playback/VLCKitRendererIOS.swift
          - Playback/VLCKitRendererTVOS.swift
          - Playback/VLCKitEnhancedPictureInPicture.swift
          - Playback/DuskVLCRawVideoOutput.h
          - Playback/DuskVLCRawVideoOutput.m
          - Features/Player/PlayerControlsOverlay.swift
          - Features/Player/PlayerView.swift
          - Features/Player/PlayerLoadingView.swift
          - Features/Player/PlayerUpNextPosterView.swift
          - Features/Settings/SettingsTVView.swift
          - Features/Player/PlayerControlsSharedViews.swift
          - Features/Player/PlayerControlsIOSOverlay.swift
          - Features/Player/PlayerControlsTVOverlay.swift
          - Features/Player/PlayerUpNextOverlayView.swift
          - Features/Settings/SettingsIOSView.swift
          - Features/Supporter/AppIconPickerView.swift
          - Features/Supporter/SupporterPrompt.swift
          - Features/Supporter/SupporterView.swift
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          - LaunchScreen.storyboard
          - LaunchScreen-tvOS.storyboard
    settings:
      base:
        ARCHS: arm64
        # Keep the app's real code in its executable. A shared debug launcher
        # UUID can confuse macOS local-network privacy attribution.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.mac
        PRODUCT_NAME: Dusk
        INFOPLIST_FILE: Dusk/Support/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Dusk/Support/Dusk-macOS.entitlements
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: DuskIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - framework: Frameworks/VLCKit.xcframework
        embed: true
      - framework: Frameworks/DuskDovi.xcframework
        embed: false

  Dusk-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Dusk/Sources
      - path: Dusk/Resources
        buildPhase: resources
        excludes:
          # Alternate app icons are iOS-only; tvOS would need layered image stacks.
          - DuskIcon.icon
          - DuskIconDawn.icon
          - DuskIconMidnight.icon
          - DuskIconNeon.icon
          - DuskIconMono.icon
          - DuskIconAurora.icon
          - DuskIconGoldenHour.icon
          - DuskIconVelvet.icon
          - DuskIconEmerald.icon
          - DuskIconGilded.icon
          - LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app
        # Adds the App Group the Top Shelf extension reads its snapshot from.
        # iOS keeps Dusk.entitlements, so its signing is untouched.
        CODE_SIGN_ENTITLEMENTS: Dusk/Support/Dusk-tvOS.entitlements
        PRODUCT_NAME: Dusk
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Dusk/Support/Info-tvOS.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconTV
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        # The global accent is the app's only tint (label color, never coral).
        # On tvOS it also matches the tab bar's tint (Color.duskTVTabBarTint), so
        # a bar that falls back to the window tint looks the same.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Dusk/Sources/Playback $(PROJECT_DIR)/Frameworks/TVVLCKit.xcframework/tvos-arm64/TVVLCKit.framework/Headers $(PROJECT_DIR)/Frameworks/TVVLCKit.xcframework/tvos-arm64-simulator/TVVLCKit.framework/Headers"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: Dusk/Support/Dusk-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      # UIWindow.avDisplayManager is supplied by an Objective-C category in
      # AVKit. Importing AVKit is not enough to load that category at runtime.
      - sdk: AVKit.framework
      - framework: Frameworks/TVVLCKit.xcframework
        embed: true
      - framework: Frameworks/DuskDovi.xcframework
        embed: false
      - target: DuskTopShelf
    postBuildScripts:
      - script: ./scripts/verify_embedded_vlckit.sh
        name: Verify embedded VLCKit is not stale
        basedOnDependencyAnalysis: false

  # tvOS Top Shelf: shows Continue Watching from the snapshot the app writes
  # into the shared App Group (Dusk/Sources/TopShelf). No Plex access of its own.
  DuskTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: DuskTopShelf
        excludes:
          - Info.plist
          - DuskTopShelf.entitlements
      - path: Dusk/Sources/TopShelf/TopShelfSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app.topshelf
        PRODUCT_NAME: DuskTopShelf
        CODE_SIGN_ENTITLEMENTS: DuskTopShelf/DuskTopShelf.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: DuskTopShelf/Info.plist
        DEVELOPMENT_TEAM: ""
        APPLICATION_EXTENSION_API_ONLY: true
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - sdk: TVServices.framework

  # Unit tests, hosted by the app so StoreKitTest can drive Dusk.storekit.
  DuskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DuskTests
      - path: Dusk/Support/Dusk.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dusk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dusk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Dusk

  DuskTests-tvOS:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: DuskTests
      - path: Dusk/Support/Dusk.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dusk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dusk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: Dusk-tvOS

# Explicit schemes so the StoreKit configuration file is attached to Run;
# without it the supporter purchases can't be exercised in the simulator.
schemes:
  Dusk-macOS:
    build:
      targets:
        Dusk-macOS: all
    run:
      config: Debug
    archive:
      config: Release
  Dusk:
    build:
      targets:
        Dusk: all
    run:
      config: Debug
      storeKitConfiguration: Dusk/Support/Dusk.storekit
    test:
      config: Debug
      targets:
        - DuskTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Dusk-tvOS:
    build:
      targets:
        Dusk-tvOS: all
    run:
      config: Debug
      storeKitConfiguration: Dusk/Support/Dusk.storekit
    test:
      config: Debug
      targets:
        - DuskTests-tvOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
