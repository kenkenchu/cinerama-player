name: Dusk
options:
  bundleIdPrefix: com.dusk-player
  deploymentTarget:
    macOS: "26.0"
    tvOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  fileTypes:
    icon: folder.iconcomposer.icon

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Dusk-macOS:
    type: application
    platform: macOS
    sources:
      - path: Dusk/Sources
      - path: Dusk/Resources
        buildPhase: resources
    settings:
      base:
        ARCHS: arm64
        # Keep the app's real code in its executable. A shared debug launcher
        # UUID can confuse macOS local-network privacy attribution.
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.mac
        PRODUCT_NAME: Dusk
        INFOPLIST_FILE: Dusk/Support/Info-macOS.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Dusk/Support/Dusk-macOS.entitlements
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: DuskIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - framework: Frameworks/VLCKit.xcframework
        embed: true
      - framework: Frameworks/DuskDovi.xcframework
        embed: false
    postBuildScripts:
      - script: ./scripts/verify_embedded_vlckit.sh
        name: Verify embedded desktop VLCKit
        basedOnDependencyAnalysis: false

  Dusk-tvOS:
    type: application
    platform: tvOS
    sources:
      # TV UI lives outside the recursive Mac source tree.
      - path: DuskTV/Sources
      - path: DuskTV/Resources
        buildPhase: resources
      - path: Dusk/Sources/Models
      - path: Dusk/Sources/PlexService
      - path: Dusk/Sources/Shared/AppImageCache.swift
      - path: Dusk/Sources/Shared/String+NilIfEmpty.swift
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.tv.prototype
        PRODUCT_NAME: DuskTV
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: TVIcon
        INFOPLIST_FILE: DuskTV/Support/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DUSK_TVOS_TEAM)"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_DEBUG_DYLIB: NO
        TARGETED_DEVICE_FAMILY: "3"

  DuskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DuskTests
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: com.dusk-player.mac.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dusk.app/Contents/MacOS/Dusk"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Dusk-macOS

schemes:
  Dusk-macOS:
    build:
      targets:
        Dusk-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DuskTests
    archive:
      config: Release

  Dusk-tvOS:
    build:
      targets:
        Dusk-tvOS: all
    run:
      config: Debug
    archive:
      config: Release
