# Optional Mac development processes. Nothing autostarts or launches the app.
name: dusk-player-mac
processes:
  - name: Fetch Desktop VLCKit
    cmd: ./ci_scripts/install_macos_vlckit.sh
    args: []
    cwd: .
    autostart: false
  - name: Build Mac App
    cmd: ./scripts/build_macos.sh
    args: []
    cwd: .
    autostart: false
